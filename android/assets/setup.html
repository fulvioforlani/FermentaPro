<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fermentati</title>
<style>
:root{--bg:#090e0b;--panel:#131c17;--line:rgba(196,236,208,.16);--tx:#eef3ec;--tx2:#c9d4cb;--mut:#93a398;--green:#8be36b;--amber:#f5b544;--red:#ff5c7a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;
  background:radial-gradient(500px 360px at 0% 0%,rgba(139,227,107,.12),transparent 60%),radial-gradient(500px 360px at 100% 100%,rgba(245,181,68,.10),transparent 60%),var(--bg)}
main{width:100%;max-width:420px;text-align:center}
svg.logo{width:118px;height:auto;margin:0 auto 6px;display:block;overflow:visible}
.bub{animation:rise 3.6s ease-in infinite;opacity:0}
.bub:nth-of-type(2){animation-delay:1.1s}.bub:nth-of-type(3){animation-delay:2.2s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-38px);opacity:0}}
h1{margin:6px 0 2px;font:italic 400 40px/1.05 serif}
h1 em{color:var(--amber)}
.sub{margin:0 0 26px;color:var(--mut);font-size:15px}
.card{padding:20px;border-radius:22px;background:rgba(20,30,24,.8);border:1px solid var(--line);text-align:left}
label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.inp{display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.inp:focus-within{border-color:rgba(139,227,107,.6);box-shadow:0 0 0 4px rgba(139,227,107,.12)}
.inp span{color:var(--mut);font-size:15px}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:600 21px sans-serif;padding:14px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:14px;border-radius:15px;border:1px solid transparent;font:700 16.5px sans-serif;cursor:pointer}
.primary{color:#0b1a0f;background:linear-gradient(140deg,#8be36b,#b6f29b);box-shadow:0 12px 28px -12px rgba(139,227,107,.85)}
.ghost{color:var(--tx);background:rgba(255,255,255,.04);border-color:var(--line)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6}
.msg{min-height:22px;margin:12px 2px 0;font-size:14.5px;color:var(--tx2)}
.msg.ok{color:var(--green)}.msg.ko{color:var(--red)}.msg.wait{color:var(--amber)}
.hint{margin:18px 4px 0;color:var(--mut);font-size:13.5px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 120 150" aria-hidden="true">
    <ellipse cx="60" cy="144" rx="40" ry="4" fill="#000" opacity=".5"/>
    <rect x="33" y="6" width="54" height="15" rx="4" fill="#d9a03a"/><rect x="35" y="4" width="50" height="6" rx="3" fill="#ffe7a6"/>
    <path d="M36 22h48v5c0 4 4 6 9 8 7 3 9 7 9 14v76c0 9-6 15-15 15H33c-9 0-15-6-15-15V49c0-7 2-11 9-14 5-2 9-4 9-8z" fill="rgba(210,245,230,.06)" stroke="rgba(225,255,240,.45)" stroke-width="2"/>
    <path d="M20 70q20-5 40 0t40 0v57c0 8-5 12-13 12H33c-8 0-13-4-13-12z" fill="#8be36b" opacity=".85"/>
    <path d="M20 100q20-4 40 0t40 0v27c0 8-5 12-13 12H33c-8 0-13-4-13-12z" fill="#ff8a2b" opacity=".9"/>
    <path d="M27 58v62" stroke="#fff" stroke-opacity=".35" stroke-width="3.5" stroke-linecap="round"/>
    <circle class="bub" cx="48" cy="112" r="3" fill="#fff" fill-opacity=".5"/><circle class="bub" cx="70" cy="118" r="2.4" fill="#fff" fill-opacity=".5"/><circle class="bub" cx="60" cy="108" r="2" fill="#fff" fill-opacity=".5"/>
  </svg>
  <h1>Fermen<em>tati</em></h1>
  <p class="sub">Indirizzo del PC di casa</p>
  <form class="card" id="f" autocomplete="off">
    <label for="a">Indirizzo</label>
    <div class="inp"><span>http://</span><input id="a" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="192.168.1.58:8954"></div>
    <p class="msg" id="m" aria-live="polite"></p>
    <button class="btn primary" id="go" type="submit">Prova e apri</button>
    <button class="btn ghost" id="anyway" type="button" hidden>Apri comunque</button>
    <button class="btn ghost" id="def" type="button">Usa quello predefinito</button>
  </form>
  <p class="hint">Il telefono deve essere sul WiFi di casa. Per cambiarlo dopo: tieni premuto un punto vuoto dell'app.</p>
</main>
<script>
var B = window.Fermentati, a = document.getElementById('a'), m = document.getElementById('m'), go = document.getElementById('go'), any = document.getElementById('anyway');
var def = B ? B.defaultAddress() : '192.168.1.58:8954';
a.value = (B && B.getAddress()) || def;
document.getElementById('def').onclick = function () { a.value = def; msg('', ''); };
function msg(t, c) { m.textContent = t; m.className = 'msg ' + (c || ''); }
document.getElementById('f').onsubmit = function (e) {
  e.preventDefault(); any.hidden = true;
  if (!B) { msg('Apri questa pagina dall’app Fermentati.', 'ko'); return; }
  var r = B.check(a.value);
  if (r === 'invalid') { msg('Scrivi un indirizzo tipo 192.168.1.58:8954', 'ko'); return; }
  if (r.indexOf('notlocal:') === 0) { msg('Solo indirizzi di casa (192.168.0.x, 192.168.1.x), nome.local o nome Tailscale (.ts.net)', 'ko'); return; }
  a.value = r.slice(3);
  msg('Provo a collegarmi…', 'wait'); go.disabled = true;
  B.ping(a.value);
};
window.onPing = function (ok) {
  go.disabled = false;
  if (ok) { msg('Trovato! Apro…', 'ok'); B.saveAndOpen(a.value); }
  else { msg('Non risponde. PC acceso? Stesso WiFi?', 'ko'); any.hidden = false; }
};
any.onclick = function () { B.saveAndOpen(a.value); };
</script>
</body>
</html>
